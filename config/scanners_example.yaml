# Compatibility copy.
# Canonical path: tools/helios_generation/config/scanners_example.yaml
# Scanner placements for HELIOS++ TLS-style legs (dummy layout).
# Coordinates are metres in the same world frame as the IFC (see data/model_0_z_up.ifc).
# attitude_deg: intrinsic yaw / pitch / roll in degrees (Z then Y then X, extrinsic order
# used only for notebook visualization of view direction; HELIOS++ legs below use platform x,y,z
# and scanner head sweep parameters from the stock tripod + panoscanner definitions).

coordinate_system: z_up

helios:
  # References files under HELIOS++ data root (e.g. $CONDA_PREFIX/share/helios).
  platform_ref: data/platforms.xml#tripod
  scanner_ref: data/scanners_tls.xml#panoscanner
  pulse_freq_hz: 100000
  scan_freq_hz: 100
  head_rotate_per_sec_deg: 10.0
  head_rotate_start_deg: -180.0
  head_rotate_stop_deg: 180.0

scanners:
  # Cardinal layout: +Y north, +X east, -X west (world matches IFC z-up export).
  - id: scan_south_east
    position: [-9.5, 4.6, 1.5]
    attitude_deg:
      yaw: -90.0
      pitch: 0.0
      roll: 0.0
    head_rotate_start_deg: -180.0
    head_rotate_stop_deg: 180.0
    head_rotate_per_sec_deg: 10.0

  - id: scan_south_west
    position: [3.5, 4.0, 1.5]
    attitude_deg:
      yaw: 180.0
      pitch: 0.0
      roll: 0.0
    head_rotate_start_deg: -180.0
    head_rotate_stop_deg: 180.0
    head_rotate_per_sec_deg: 10.0

  - id: scan_north_west
    position: [3.4, -8, 1.5]
    attitude_deg:
      yaw: 0.0
      pitch: 0.0
      roll: 0.0
    head_rotate_start_deg: -180.0
    head_rotate_stop_deg: 180.0
    head_rotate_per_sec_deg: 10.0

  - id: scan_north_east
    position: [-9.5, -9.3, 1.5]
    attitude_deg:
      yaw: 90.0
      pitch: 0.0
      roll: 0.0
    head_rotate_start_deg: -180.0
    head_rotate_stop_deg: 180.0
    head_rotate_per_sec_deg: 10.0

  - id: scan_center
    position: [-2.4, -3.0, 1.5]
    attitude_deg:
      yaw: 0.0
      pitch: 0.0
      roll: 0.0
    head_rotate_start_deg: -180.0
    head_rotate_stop_deg: 180.0
    head_rotate_per_sec_deg: 10.0
